name: Skill tools

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.15', '3.11']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Test PR heads once, rather than both branch pushes and PR merge refs.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install document and test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10" "ruff>=0.14,<1"
      - name: Check standalone scripts
        run: python -m compileall -q scripts
      - name: Lint
        run: python -m ruff check scripts tests dev .github/scripts
      - name: Verify installed Pandoc identity
        run: python -c "import sys; sys.path.insert(0, 'scripts'); from _publication_convert import pandoc_binary, pandoc_version; print(pandoc_version(pandoc_binary()))"
      - name: Run isolated tool tests
        run: python -m pytest -q --junitxml=pytest-report.xml
      - name: Annotate failed tests
        if: failure()
        run: python .github/scripts/annotate_junit.py pytest-report.xml
      - name: Package the portable skill
        if: matrix.os == 'windows-latest' && matrix.python == '3.15'
        run: git archive --format=zip --prefix=think-tank/ --output=think-tank.zip HEAD SKILL.md LICENSE requirements.txt scripts references assets
      - name: Upload the installable skill archive
        if: matrix.os == 'windows-latest' && matrix.python == '3.15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: think-tank-skill
          path: think-tank.zip
          if-no-files-found: error
